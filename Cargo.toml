[package]
name = "cargo-korox"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cargo-korox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
walkdir = "2.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"