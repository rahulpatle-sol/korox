[package]
name = "cargo-korox"
version = "0.1.0"
edition = "2024"
description = "Rust-native developer quality toolkit - local-first, lightweight code analyzer for cleaner, safer Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rahulpatle-sol/korox"
homepage = "https://github.com/rahulpatle-sol/korox"
documentation = "https://docs.rs/cargo-korox"
keywords = ["lint", "analyzer", "code-quality", "rust", "clippy"]
categories = ["development-tools", "development-tools::debugging", "development-tools::profiling"]
readme = "README.md"

[lib]
name = "cargo_korox"
path = "src/lib.rs"

[[bin]]
name = "cargo-korox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
walkdir = "2.5"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
notify = { version = "6.1", features = ["crossbeam-channel"] }
tokio = { version = "1.38", features = ["full", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true