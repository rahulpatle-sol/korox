name: Bug Report
description: File a bug report for cargo-korox
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: cargo-korox version
      description: Run `cargo-korox --version` or `cargo metadata | grep korox`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust version
      description: Run `rustc --version`
      placeholder: "1.75.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Create a file with...
        2. Run `cargo-korox check`
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Korox should...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Korox instead...
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Sample Code
      description: Minimal code snippet that triggers the bug
      render: rust
      placeholder: |
        fn main() {
            let x = vec![1,2,3].clone();
        }
  - type: textarea
    id: output
    attributes:
      label: Full Output
      description: Paste the full output of `cargo-korox check --verbose`
      render: text
      placeholder: |
        $ cargo-korox check
        ...
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I have tested with the latest version
          required: true