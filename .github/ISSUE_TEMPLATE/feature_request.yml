name: Feature Request
description: Suggest a new rule or feature for cargo-korox
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - New Rule
        - New Command/Flag
        - Config Improvement
        - Documentation
        - Performance
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like?
      placeholder: I'd like a rule that detects...
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
      placeholder: This would help catch...
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Show code that should trigger the rule / feature
      render: rust
      placeholder: |
        // Bad code
        fn bad() {
            let x = 5 as u8; // truncation risk
        }

        // Good code
        fn good() {
            let x: u8 = 5;
        }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other ways to solve this
      placeholder: Could also use clippy's...
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This isn't already covered by clippy/rustc
          required: true
        - label: I've checked the roadmap (Phases 4-6)
          required: true