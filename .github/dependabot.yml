version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "deps(cargo)"
    groups:
      clippy:
        patterns:
          - "clap*"
        update-types:
          - "minor"
          - "patch"
      serde:
        patterns:
          - "serde*"
        update-types:
          - "minor"
          - "patch"
      rust-toolchain:
        patterns:
          - "rust-toolchain*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"